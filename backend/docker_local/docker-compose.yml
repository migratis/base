# Dedicated project name so this standalone app never collides with another
# Compose project on the same host (networks, volumes and `docker compose down`
# stay scoped to "base").
name: base

services:
  # PostgreSQL — only started when the "postgres" profile is enabled, so the
  # default SQLite setup never runs an unused database container.
  #   Switch to Postgres:  set USE_SQLITE=False in migratis/.env, then
  #                        docker compose --profile postgres up --build
  # Credentials fall back to the same defaults as migratis/.env; override here
  # (or via a backend/.env) if you change DB_USER / DB_PASSWORD / DB_NAME there.
  base-db:
    image: postgres:18.3
    container_name: base-db
    profiles: ["postgres"]
    environment:
      - POSTGRES_DB=${DB_NAME:-migratis}
      - POSTGRES_USER=${DB_USER:-migratis}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-change-me}
    volumes:
      - pgdata_migratis:/var/lib/postgresql
    expose:
      - "5432"
  base-api:
    container_name: backend-base-api-1
    build:
      context: .
    entrypoint: /docker-entrypoint.sh
    volumes:
      - .:/backend
      - ../frontend:/frontend
    expose:
      - "8004"
    ports:
      - "8004:8004"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Road-following routes for `geo` fields in route mode (the optional `routing`
  # module). Declared always, started only when asked:
  #     docker compose --profile routing up -d
  # A country-sized OSM extract must not become a mandatory dependency of every
  # install merely because the compose file mentions it — the same argument as
  # base-db's "postgres" profile above.
  #
  # The installer CANNOT start this. It is Django code running inside base-api
  # with no Docker socket, and must not be given one: mounting the docker socket
  # into a web-facing container is host root for anyone who reaches that
  # endpoint. So an install with `routing` selected activates all of the code and
  # none of the service, and says so in its response (`routing_service_required`).
  #
  # The first start BUILDS THE TILES from the extract below — minutes to hours,
  # and the real disk/RAM spike. Point `tile_urls` at the region you actually
  # need (see https://download.geofabrik.de/), then set ROUTING_ENGINE_URL in
  # migratis/.env to http://base-routing:8002 and restart the backend.
  base-routing:
    image: ghcr.io/valhalla/valhalla:latest
    container_name: base-routing
    profiles: ["routing"]
    environment:
      - tile_urls=${ROUTING_TILE_URLS:-https://download.geofabrik.de/europe/monaco-latest.osm.pbf}
      - serve_tiles=True
      - build_elevation=False
    volumes:
      - valhalla_tiles:/custom_files
    # No `ports:` — the browser never speaks to the engine. MapField posts
    # waypoints to Django and Django calls this over the compose network.
    expose:
      - "8002"

volumes:
  pgdata_migratis: {}
  valhalla_tiles: {}
