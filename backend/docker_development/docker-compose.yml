# Development stack. Like the database, the routing engine (`base-routing`) is
# NOT declared here: dev and production resolve to the same compose project, so
# a service named in both files would be one container that either stack could
# stop — and `docker compose down -v` on dev would destroy a tile build measured
# in hours. Production declares it; dev reaches it over the shared network at
# http://base-routing:8002, which is what ROUTING_ENGINE_URL should point at.
services:
  base-api_dev:
    build: 
      context: .
    entrypoint: /docker-entrypoint.sh
    volumes:
      - .:/backend
      - ../frontend:/frontend      
    expose:
      - "8003"
    ports:
      - "8003:8003"
    networks:
      static-network:
        ipv4_address: 172.21.0.4
networks:
  static-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/16
volumes:
  pgdata: {}
